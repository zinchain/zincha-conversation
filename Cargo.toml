[package]
name = "zincha-conversation"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Off-chain, participant-authorized conversations for Zincha workflows"
repository = "https://github.com/zinchain/zincha-conversation"

[lib]
name = "zincha_conversation"
path = "src/lib.rs"

[[bin]]
name = "zincha-conversation"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
async-stream = "0.3"
axum = { version = "0.8", features = ["macros", "json"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
futures-util = "0.3"
hex = "0.4"
hkdf = "0.12"
rand = "0.8"
rcgen = { version = "0.14", features = ["crypto", "pem"] }
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.1"
serde_json = "1"
sha2 = "0.10"
subtle = "2"
rustls-pemfile = "2"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "sqlite", "uuid", "json", "migrate", "macros"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v7"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }
x509-parser = "0.18"

[dev-dependencies]
serde_yaml = "0.9"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
